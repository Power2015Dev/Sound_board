appId: com.power2015.soundboard
productName: Sound Board
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
# Windows: instalador (NSIS) y version portable de 64 bits
win:
  executableName: sound-board
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: Sound-Board-${version}-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: Sound-Board-${version}-Portable.${ext}
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: Sound-Board-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Power2015
  category: Audio
appImage:
  artifactName: Sound-Board-${version}.${ext}
npmRebuild: false
# Publicacion en GitHub Releases
publish:
  provider: github
  owner: Power2015Dev
  repo: Sound_board
